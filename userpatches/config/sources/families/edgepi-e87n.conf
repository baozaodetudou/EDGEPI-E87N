# SPDX-License-Identifier: GPL-2.0
# Standalone family: upstream filogic rejects MT7987 before an overlay can load.
# Keep Filogic package/config naming, but never load its raw bootloader writer.
declare -g ARCH=arm64
declare -g LINUXFAMILY=filogic
declare -g OFFSET=16
declare -g IMAGE_PARTITION_TABLE=gpt
declare -g BOOT_SOC=mt7987
declare -g ATF_COMPILE=no
declare -g BOOTCONFIG=none
declare -g UBOOT_TARGET_MAP=';;'
declare -g BOOTENV_FILE=''
declare -g BOOTSCRIPT=''
# The minimal wired prototype ships its two checked PHY blobs via customize-image.
# Extra USB/Wi-Fi firmware is not included in this first-board bring-up image.
declare -g INSTALL_ARMBIAN_FIRMWARE=no

case "$BRANCH" in
	current)
		declare -g KERNELSOURCE='https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
		# Latest LTS checked on 2026-09-12. Pin the commit; never float to non-LTS.
		declare -g KERNELBRANCH='commit:f6388029ea9e2c9e807d73827658738ea131faee'
		declare -g KERNEL_MAJOR_MINOR=6.18
		declare -g KERNELPATCHDIR=edgepi-e87n-6.18
		declare -g LINUXCONFIG=linux-edgepi-e87n-lts
		;;
	*) exit_with_error 'E87N supports BRANCH=current only' "$BRANCH" ;;
esac
