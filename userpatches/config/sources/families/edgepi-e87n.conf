# Standalone family: upstream filogic rejects MT7987 before an overlay can load.
# Isolate package naming and never load the Filogic raw bootloader writer.
_e87n_config="${BASH_SOURCE[0]%/*}/../../e87n-build.json"
_e87n_values=$(python3 - "$_e87n_config" <<'PY'
import json
import re
import sys
with open(sys.argv[1]) as stream:
    c = json.load(stream)
assert c['linux_family'] == 'edgepi-e87n'
assert re.fullmatch(r'[0-9a-f]{40}', c['kernel_commit'])
assert c['kernel_series'] == '6.18'
assert c['kernel_source'] == 'https://github.com/frank-w/BPI-Router-Linux.git'
print('|'.join(c[k] for k in ('kernel_source', 'kernel_commit', 'kernel_series', 'linux_family')))
PY
) || { exit_with_error 'Invalid E87N source manifest'; return 1; }
IFS='|' read -r _e87n_source _e87n_commit _e87n_series _e87n_family <<< "$_e87n_values"
declare -g ARCH=arm64
declare -g LINUXFAMILY="$_e87n_family"
declare -g OFFSET=16
declare -g IMAGE_PARTITION_TABLE=gpt
declare -g BOOT_SOC=mt7987
declare -g ATF_COMPILE=no
declare -g BOOTCONFIG=none
declare -g UBOOT_TARGET_MAP=';;'
declare -g BOOTENV_FILE=''
declare -g BOOTSCRIPT=''
# The minimal wired prototype ships its two checked PHY blobs via customize-image.
# Extra USB/Wi-Fi firmware is not included in this first-board bring-up image.
declare -g INSTALL_ARMBIAN_FIRMWARE=no

case "$BRANCH" in
	current)
		declare -g KERNELSOURCE="$_e87n_source"
		declare -g KERNELBRANCH="commit:$_e87n_commit"
		declare -g KERNEL_MAJOR_MINOR="$_e87n_series"
		declare -g KERNELPATCHDIR=edgepi-e87n-6.18
		declare -g LINUXCONFIG=linux-edgepi-e87n-lts
		;;
	*) exit_with_error 'E87N supports BRANCH=current only' "$BRANCH" ;;
esac
unset _e87n_config _e87n_values _e87n_source _e87n_commit _e87n_series _e87n_family
