name: E87N Debian 13 ARM64 固件构建与发布

run-name: "E87N image release · 手动构建 #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e87n-image-${{ github.ref }}
  # Let the current image finish and upload its evidence.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GIT_TERMINAL_PROMPT: '0'
  DEBIAN_FRONTEND: noninteractive

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      image_artifact: ${{ steps.release_tag.outputs.image_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Resolve image release identity and check manual main-branch build
        id: release_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            printf 'Only manual main-branch builds may publish.\n' >&2
            exit 1
          fi
          release_tag=$(python3 scripts/release_identity.py tag --kind image)
          image_artifact=$(python3 scripts/release_identity.py artifact --kind image \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
          python3 scripts/ci-publish-release.py preflight --kind image \
            --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" --tag "$release_tag" \
            --replace-existing
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'image_artifact=%s\n' "$image_artifact" >> "$GITHUB_OUTPUT"
      - name: Install validation tools
        run: |
          mkdir -p output/ci/logs
          set -o pipefail
          {
            sudo -n apt-get update
            sudo -n apt-get install -y --no-install-recommends \
              gcc shellcheck python3-yaml python3-pil fonts-dejavu-core fonts-wqy-microhei device-tree-compiler \
              u-boot-tools e2fsprogs util-linux python3 initramfs-tools-core fdisk \
              patch kmod zstd xz-utils dpkg-dev init-system-helpers python3-minimal libcrypt1 cpio
            GOBIN="$RUNNER_TEMP/e87n-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
            echo "$RUNNER_TEMP/e87n-tools" >> "$GITHUB_PATH"
          } 2>&1 | tee output/ci/logs/validation-tools.log
      - name: Validate image workflow and CI helpers without building
        run: |
          mkdir -p output/ci/logs
          bash scripts/ci-validate.sh image 2>&1 | tee output/ci/logs/validation.log
      - name: Run full userspace, image and package regressions
        timeout-minutes: 10
        run: bash scripts/ci-regressions.sh
      - name: Capture validation failure evidence
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ job.status }}
        run: bash scripts/ci-capture-failure-evidence.sh validate "$BUILD_OUTCOME"
      - name: Upload validation log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e87n-image-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/logs/
            output/ci/failure-evidence/
          if-no-files-found: warn
          retention-days: 14

  image:
    needs: validate
    # Native ARM64 on GitHub's disposable public-repository runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      E87N_REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Prepare native runner and check disk budget
        timeout-minutes: 15
        env:
          E87N_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          mkdir -p output/ci/logs
          bash scripts/ci-prepare-runner.sh 2>&1 | tee output/ci/logs/runner.log
      - name: Build pinned image and validate final firmware in Docker and QEMU
        id: build
        # Reserve time for hashing and uploads below, including build failures.
        timeout-minutes: 285
        run: bash scripts/ci-build.sh image
      - name: Capture image failure evidence
        if: ${{ always() }}
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: bash scripts/ci-capture-failure-evidence.sh image "$BUILD_OUTCOME"
      - name: Collect firmware tar, packages, checksums and build evidence
        if: ${{ always() }}
        timeout-minutes: 15
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          sudo -n env \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            python3 scripts/ci-collect-artifacts.py --kind image --status "$BUILD_OUTCOME"
      - name: Upload firmware candidate and packages
        if: ${{ always() }}
        timeout-minutes: 25
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.validate.outputs.image_artifact }}
          path: output/ci/artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Upload build logs independently
        if: ${{ always() }}
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e87n-image-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/ci/logs/
            output/ci/failure-evidence/
            source/armbian-build/output/logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    # Collection and publication recheck the final firmware and same-build
    # QEMU evidence against the source/run/attempt identity.
    needs: [validate, image]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      - name: Download this run's image artifact
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARTIFACT: ${{ needs.validate.outputs.image_artifact }}
        run: |
          gh auth status --hostname github.com >/dev/null 2>&1
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$IMAGE_ARTIFACT" \
            --dir output/release-input/image
      - name: Verify and prepare image release assets
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          python3 scripts/ci-prepare-release.py \
            --kind image --artifact output/release-input/image \
            --output output/release-assets --source-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - name: Publish verified firmware as a tagged experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          python3 scripts/ci-publish-release.py publish --kind image \
            --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA" \
            --tag "$RELEASE_TAG" --assets output/release-assets --replace-existing \
            --replacement-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
